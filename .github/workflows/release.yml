name: Release

# Bump the version (python3 tools/ci/version.py bump X.Y.Z), fill in the CHANGELOG entry and
# push to main. When anti_matter/config.yaml carries a version that has no tag yet, this
# runs the full CI, tags vX.Y.Z and publishes a GitHub release in this repository.

on:
  push:
    branches: [main]
    paths: [anti_matter/config.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(python3 tools/ci/version.py get)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released — nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            python3 tools/ci/version.py notes "$version" > /dev/null # fail early without a CHANGELOG entry
          fi

  ci:
    name: CI
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag and GitHub release
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci/version.py notes "$VERSION" > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Anti-Matter $VERSION" --notes-file notes.md
